<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#f7f4ee; --card:#fff; --ink:#2b2b2b; --muted:#6b6b6b;
    --accent:#c2410c; --line:#e6e0d6; --nl:#ea580c; --be:#1d4ed8; --hotel:#16a34a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  header{padding:22px 20px 14px;text-align:center;border-bottom:1px solid var(--line);background:var(--card);}
  header h1{margin:0;font-size:22px;letter-spacing:.5px;}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px;}
  .layout{display:flex;flex-direction:column;height:calc(100vh - 78px);}
  #map{width:100%;height:46vh;min-height:300px;z-index:1;}
  .panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 60px;}
  .daybtns{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 4px;background:var(--bg);position:sticky;top:0;z-index:5;}
  .daybtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:.15s;color:var(--ink);}
  .daybtn:hover{border-color:var(--accent);}
  .daybtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .daybtn.be.active{background:var(--be);border-color:var(--be);}
  .daybtn.all{background:#1f2937;color:#fff;border-color:#1f2937;font-weight:600;}
  .daybtn.all.active{background:#111827;border-color:#111827;}
  .pin.train{border-radius:7px;font-size:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 14px;margin:12px auto;max-width:680px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
  .card h2{margin:0 0 2px;font-size:19px;}
  .card .date{color:var(--accent);font-weight:600;font-size:13px;}
  .card.be .date{color:var(--be);}
  .stop{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);}
  .stop:first-of-type{border-top:none;margin-top:8px;}
  .pin{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;cursor:pointer;}
  .card.be .pin{background:var(--be);}
  .pin.hotel{background:var(--hotel);border-radius:8px;}
  .stop.hotelrow{background:#f0fdf4;border-radius:10px;border-top:none;margin-top:8px;padding:10px 10px;}
  .stop .info{flex:1;}
  .stop .info .t{font-weight:600;font-size:15px;}
  .stop .info .time{color:var(--muted);font-size:12px;margin-left:6px;font-weight:400;}
  .stop .info .d{color:var(--muted);font-size:13.5px;margin-top:2px;line-height:1.45;}
  .stop .info .eat{font-size:13px;margin-top:4px;color:#a16207;}
  .tip{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:9px 12px;font-size:13px;margin-top:10px;color:#9a3412;line-height:1.5;}
  .tip.book{background:#eff6ff;border-color:#bfdbfe;color:#1e40af;}
  .tip.warn{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
  .tip.hotel{background:#f0fdf4;border-color:#bbf7d0;color:#166534;}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin:8px 0 0;}
  .leaflet-popup-content{font-size:13.5px;line-height:1.45;}
  .leaflet-popup-content b{font-size:14px;}
</style>
</head>

function makeIcon(num,country){
  const color=country==='be'?'#1d4ed8':'#ea580c';
  return L.divIcon({className:'',html:`<div style="width:28px;height:28px;border-radius:50%;background:${color};color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${num}</div>`,iconSize:[28,28],iconAnchor:[14,14],popupAnchor:[0,-14]});
}
function trainIcon(country){
  const color=country==='be'?'#1d4ed8':'#ea580c';
  return L.divIcon({className:'',html:`<div style="width:30px;height:30px;border-radius:8px;background:${color};color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">🚆</div>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-15]});
}
function hotelIcon(){
  return L.divIcon({className:'',html:`<div style="width:32px;height:32px;border-radius:8px;background:#16a34a;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)">🏨</div>`,iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-16]});
}
function showOverview(){
  clearMarkers();clearRoutes();
  const A=[52.3791,4.9003],SC=[52.3091,4.7620],DL=[52.0061,4.3565],RO=[51.9249,4.4699],
        BM=[50.8358,4.3360],BC=[50.8454,4.3571],AN=[51.2172,4.4210];
  const routes=[
    {pts:[A,DL,RO],color:'#ea580c',dash:null},
    {pts:[SC,BM],color:'#7c3aed',dash:'8,8'},
    {pts:[BC,AN],color:'#1d4ed8',dash:null},
  ];
  routes.forEach(r=>{const l=L.polyline(r.pts,{color:r.color,weight:3.5,opacity:.55,dashArray:r.dash}).addTo(map);routeLines.push(l);});
  const all=[];
  STATIONS.forEach(s=>{const m=L.marker(s.ll,{icon:trainIcon(s.c)}).addTo(map);m.bindPopup(`<b>🚆 ${s.n}</b><br>${s.d}`);markers.push(m);all.push(s.ll);});
  HOTELS.forEach(h=>{const m=L.marker(h.ll,{icon:hotelIcon()}).addTo(map);m.bindPopup(`<b>🏨 ${h.n}</b><br>${h.d}`);markers.push(m);all.push(h.ll);});
  map.fitBounds(all,{padding:[45,45]});
  const p=document.getElementById('panel');
  let html=`<div class="card"><div class="date">전체 노선</div><h2>🏨 호텔 (예약 완료)</h2>`;
  HOTELS.forEach((h,i)=>{
    html+=`<div class="stop"><div class="pin hotel" data-h="${i}">🏨</div><div class="info"><div class="t">${h.n}</div><div class="d">${h.d}</div></div></div>`;
  });
  html+=`</div><div class="card"><div class="date">전체 노선</div><h2>🚆 기차역 한눈에 보기</h2>`;
  STATIONS.forEach((s,i)=>{
    html+=`<div class="stop"><div class="pin train" data-s="${i}" style="background:${s.c==='be'?'#1d4ed8':'#ea580c'}">🚆</div><div class="info"><div class="t">${s.n}</div><div class="d">${s.d}</div></div></div>`;
  });
  html+=`<div class="tip book">⭐ 헷갈리지 마! <b>유로스타(국제선)</b>는 6/26 <b>스키폴역</b>서 타고 브뤼셀 <b>Midi역</b> 도착. <b>국내선 당일치기(앤트워프)</b>는 <b>브뤼셀 중앙역</b>서 출발.</div>`;
  html+=`<p class="note" style="margin-top:10px">🟢 호텔 · 🟠 네덜란드 · 🔵 벨기에 · 보라색 점선 = 유로스타(국제선)</p></div>`;
  p.innerHTML=html;p.scrollTop=0;
  const stationMarkers=STATIONS.map((s,i)=>markers[i]);
  const hotelMarkers=HOTELS.map((h,i)=>markers[STATIONS.length+i]);
  p.querySelectorAll('.pin.train').forEach(el=>{el.addEventListener('click',()=>{const i=+el.dataset.s;stationMarkers[i].openPopup();map.panTo(STATIONS[i].ll);});});
  p.querySelectorAll('.pin.hotel').forEach(el=>{el.addEventListener('click',()=>{const i=+el.dataset.h;hotelMarkers[i].openPopup();map.panTo(HOTELS[i].ll);});});
}
function showDay(d){
  clearMarkers();clearRoutes();
  const latlngs=[];
  const poiLL=[];
  d.stops.forEach((s,i)=>{
    const m=L.marker(s.ll,{icon:makeIcon(i+1,d.country)}).addTo(map);
    m.bindPopup(`<b>${i+1}. ${s.n}</b><br>${s.d}${s.eat?'<br>'+s.eat:''}`);
    markers.push(m);latlngs.push(s.ll);poiLL.push(s.ll);
  });
  // 그날 동선(스탑 순서대로) 연결선
  if(poiLL.length>1){
    const rl=L.polyline(poiLL,{color:d.country==='be'?'#1d4ed8':'#ea580c',weight:3,opacity:.45,dashArray:'5,7'}).addTo(map);
    routeLines.push(rl);
  }
  // 그날 숙소 마커
  const h=(d.hotel!=null)?HOTELS[d.hotel]:null;
  let hotelMarker=null;
  if(h){
    hotelMarker=L.marker(h.ll,{icon:hotelIcon()}).addTo(map);
    hotelMarker.bindPopup(`<b>🏨 ${h.n}</b><br><i>${d.hotelNote||'오늘 숙소'}</i><br>${h.d}`);
    markers.push(hotelMarker);latlngs.push(h.ll);
  }
  if(latlngs.length>1){map.fitBounds(latlngs,{padding:[55,55],maxZoom:14});}
  else{map.setView(latlngs[0],13);}
  const p=document.getElementById('panel');
  let html=`<div class="card ${d.country==='be'?'be':''}"><div class="date">${d.date}</div><h2>${d.title}</h2>`;
  if(h){
    html+=`<div class="stop hotelrow"><div class="pin hotel" data-hotel="1">🏨</div><div class="info"><div class="t">${h.n.replace(' ⏳변경 중','')}<span class="time">${d.hotelNote||'오늘 숙소'}</span></div><div class="d">${h.d}</div></div></div>`;
  }
  d.stops.forEach((s,i)=>{
    html+=`<div class="stop"><div class="pin" data-i="${i}">${i+1}</div><div class="info"><div class="t">${s.n}<span class="time">${s.time}</span></div><div class="d">${s.d}</div>${s.eat?`<div class="eat">${s.eat}</div>`:''}</div></div>`;
  });
  if(BOOK[d.id]) html+=`<div class="tip ${BOOK[d.id].type}">${BOOK[d.id].txt}</div>`;
  html+=`</div><p class="note">핀을 누르면 지도에서 위치를 볼 수 있어요 · 🟢 숙소 · 🟠 네덜란드 · 🔵 벨기에 · 점선 = 그날 동선</p>`;
  p.innerHTML=html;p.scrollTop=0;
  p.querySelectorAll('.pin[data-i]').forEach(el=>{el.addEventListener('click',()=>{const i=+el.dataset.i;markers[i].openPopup();map.panTo(d.stops[i].ll);});});
  const hp=p.querySelector('.pin[data-hotel]');
  if(hp&&hotelMarker){hp.addEventListener('click',()=>{hotelMarker.openPopup();map.panTo(h.ll);});}
}
const bar=document.getElementById('daybtns');
const ob=document.createElement('button');
ob.className='daybtn all active';
ob.textContent='🗺️ 전체보기';
ob.title='호텔·기차역·노선 한눈에';
ob.addEventListener('click',()=>{document.querySelectorAll('.daybtn').forEach(x=>x.classList.remove('active'));ob.classList.add('active');showOverview();});
bar.appendChild(ob);
DATA.forEach(d=>{
  const b=document.createElement('button');
  b.className='daybtn'+(d.country==='be'?' be':'');
  b.textContent=d.date.replace(/ .*/,'');
  b.title=d.title;
  b.addEventListener('click',()=>{document.querySelectorAll('.daybtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');showDay(d);});
  bar.appendChild(b);
});
showOverview();
</script>
</body>
</html>
