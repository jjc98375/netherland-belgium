<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>우리 여행 지도 · 네덜란드 & 벨기에</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1a73e8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --sight:#d93025; --museum:#7b1fa2; --food:#e8710a; --hotel:#188038; --transit:#1a73e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  #map{position:fixed;inset:0;z-index:1;}
  /* ── 상단 검색바 (구글맵 스타일) ── */
  #topbar{position:fixed;top:10px;left:10px;right:10px;z-index:1000;max-width:480px;}
  #searchbox{display:flex;align-items:center;background:#fff;border-radius:24px;
    box-shadow:0 2px 10px rgba(0,0,0,.22);padding:0 8px 0 16px;height:48px;}
  #searchbox input{flex:1;border:none;outline:none;font-size:15.5px;background:transparent;color:#222;}
  #searchbox .ic{font-size:18px;color:#5f6368;margin-right:10px;}
  #clearBtn{border:none;background:none;font-size:16px;color:#5f6368;cursor:pointer;
    width:36px;height:36px;border-radius:50%;display:none;}
  #suggest{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.2);
    margin-top:6px;max-height:46vh;overflow-y:auto;display:none;}
  .sg{display:flex;gap:11px;align-items:center;padding:11px 14px;cursor:pointer;border-top:1px solid #f1f3f4;}
  .sg:first-child{border-top:none;}
  .sg:hover,.sg:active{background:#f8f9fa;}
  .sg .dot{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:14px;color:#fff;}
  .sg .nm{font-size:14.5px;font-weight:600;color:#202124;}
  .sg .ct{font-size:12px;color:#80868b;}
  /* ── 필터 칩 ── */
  #chips{position:fixed;top:66px;left:0;right:0;z-index:999;display:flex;gap:8px;
    padding:6px 10px;overflow-x:auto;scrollbar-width:none;}
  #chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #dadce0;
    border-radius:18px;padding:7px 14px;font-size:13.5px;font-weight:600;color:#3c4043;cursor:pointer;
    box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .chip .cdot{width:9px;height:9px;border-radius:50%;}
  .chip.on{color:#fff;border-color:transparent;}
  /* ── 도시 점프 ── */
  #cities{position:fixed;bottom:88px;left:10px;z-index:999;display:flex;flex-direction:column;gap:6px;}
  .cityjump{background:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12.5px;
    font-weight:700;color:#3c4043;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.25);text-align:left;}
  .cityjump small{display:block;font-weight:400;color:#80868b;font-size:10.5px;}
  /* ── 목록 버튼/시트 ── */
  #listBtn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1000;
    background:#1a73e8;color:#fff;border:none;border-radius:24px;padding:13px 24px;
    font-size:14.5px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;background:#fff;
    border-radius:18px 18px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.3);max-height:72vh;
    transform:translateY(105%);transition:transform .28s ease;display:flex;flex-direction:column;}
  #sheet.open{transform:translateY(0);}
  #sheet .grab{width:40px;height:4px;border-radius:2px;background:#dadce0;margin:10px auto 4px;}
  #sheet h2{margin:4px 18px 8px;font-size:17px;color:#202124;}
  #sheetList{overflow-y:auto;padding:0 8px 24px;-webkit-overflow-scrolling:touch;}
  .cityhead{font-size:13px;font-weight:800;color:#1a73e8;padding:14px 12px 4px;}
  .li{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border-radius:12px;cursor:pointer;}
  .li:active{background:#f1f3f4;}
  .li .dot{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:16px;color:#fff;margin-top:2px;}
  .li .nm{font-size:15px;font-weight:700;color:#202124;}
  .li .ds{font-size:12.5px;color:#5f6368;line-height:1.45;margin-top:2px;}
  /* ── 팝업 (구글맵 카드 스타일) ── */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);}
  .leaflet-popup-content{margin:14px 16px 12px;min-width:230px;}
  .pp .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:6px;padding:2.5px 8px;}
  .pp h3{margin:6px 0 3px;font-size:16.5px;color:#202124;}
  .pp .memo{font-size:13px;color:#5f6368;line-height:1.5;margin-bottom:10px;}
  .pp .btns{display:flex;gap:8px;}
  .pp a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;
    border-radius:18px;padding:9px 0;}
  .pp a.g{background:#1a73e8;color:#fff;}
  .pp a.d{background:#e8f0fe;color:#1a73e8;}
  /* 마커 핀 */
  .pin{position:relative;width:30px;height:30px;border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:flex;align-items:center;justify-content:center;}
  .pin span{transform:rotate(45deg);font-size:13px;}
</style>
</head>
<body>

    <span class="ic">🔍</span>
    <input id="q" placeholder="장소 검색 (예: 반고흐, 와플...)" autocomplete="off"/>
    <button id="clearBtn">✕</button>
  </div>
  <div id="suggest"></div>
</div>

<div id="sheet"><div class="grab"></div><h2>📍 전체 장소</h2><div id="sheetList"></div></div>

  if(la>51.85)return '로테르담'; if(la>51.15)return '앤트워프'; return '브뤼셀';};

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
 {maxZoom:20,attribution:'© OpenStreetMap © CARTO'}).addTo(map);

function gURL(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}
function dURL(q){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q);}

const markers=[];
P.forEach((p,idx)=>{
  const [cat,name,la,lo,memo,gq]=p;
  const cc=CAT[cat];
  const icon=L.divIcon({className:'',html:
    `<div class="pin" style="background:${cc.c}"><span>${cc.i}</span></div>`,
    iconSize:[30,30],iconAnchor:[15,28],popupAnchor:[0,-26]});
  const m=L.marker([la,lo],{icon}).addTo(map);
  m.bindPopup(`<div class="pp">
    <span class="badge" style="background:${cc.c}">${cc.i} ${cat} · ${CITY_OF(p)}</span>
    <h3>${name}</h3>
    <div class="memo">${memo}</div>
    <div class="btns">
      <a class="g" href="${gURL(gq)}" target="_blank">구글맵 열기</a>
      <a class="d" href="${dURL(gq)}" target="_blank">길찾기</a>
    </div></div>`);
  markers.push({m,cat,name,memo,city:CITY_OF(p),idx});
});

/* ───────── 카테고리 칩 ───────── */

let activeCat=null;
const allChip=document.createElement('button');
allChip.className='chip on';allChip.style.background='#202124';allChip.style.color='#fff';
allChip.textContent='전체';chipsEl.appendChild(allChip);
allChip.onclick=()=>{activeCat=null;refreshChips();applyFilter();};
const catChips={};
Object.keys(CAT).forEach(k=>{
  const b=document.createElement('button');b.className='chip';
  b.innerHTML=`<span class="cdot" style="background:${CAT[k].c}"></span>${k} (${P.filter(p=>p[0]===k).length})`;
  b.onclick=()=>{activeCat=activeCat===k?null:k;refreshChips();applyFilter();};
  chipsEl.appendChild(b);catChips[k]=b;});
function refreshChips(){
  allChip.classList.toggle('on',!activeCat);
  Object.keys(catChips).forEach(k=>{
    const on=activeCat===k;
    catChips[k].classList.toggle('on',on);
    catChips[k].style.background=on?CAT[k].c:'#fff';
    catChips[k].style.color=on?'#fff':'#3c4043';});}
function applyFilter(){
  markers.forEach(o=>{
    const show=!activeCat||o.cat===activeCat;
    if(show&&!map.hasLayer(o.m))o.m.addTo(map);
    if(!show&&map.hasLayer(o.m))map.removeLayer(o.m);});
  buildSheet();}

/* ───────── 도시 점프 ───────── */
const citiesEl=document.getElementById('cities');
Object.keys(CITY_VIEW).forEach(c=>{
  const n=P.filter(p=>CITY_OF(p)===c).length;
  const b=document.createElement('button');b.className='cityjump';
  b.innerHTML=`${c}<small>${n}곳</small>`;
  b.onclick=()=>{const v=CITY_VIEW[c];map.flyTo([v[0],v[1]],v[2],{duration:0.9});};
  citiesEl.appendChild(b);});

/* ───────── 검색 ───────── */
const q=document.getElementById('q'),sg=document.getElementById('suggest'),
      clearBtn=document.getElementById('clearBtn');
q.addEventListener('input',()=>{
  const v=q.value.trim().toLowerCase();
  clearBtn.style.display=v?'block':'none';
  if(!v){sg.style.display='none';return;}
  const hits=markers.filter(o=>(o.name+o.memo+o.cat+o.city).toLowerCase().includes(v)).slice(0,8);
  sg.innerHTML=hits.length?hits.map(o=>
    `<div class="sg" data-i="${o.idx}">
      <div class="dot" style="background:${CAT[o.cat].c}">${CAT[o.cat].i}</div>
      <div><div class="nm">${o.name}</div><div class="ct">${o.city} · ${o.cat}</div></div>
    </div>`).join(''):'<div class="sg"><div class="ct">검색 결과 없음</div></div>';
  sg.style.display='block';
  sg.querySelectorAll('.sg[data-i]').forEach(el=>el.onclick=()=>{
    const o=markers[+el.dataset.i];
    sg.style.display='none';q.value=o.name;
    if(!map.hasLayer(o.m)){activeCat=null;refreshChips();applyFilter();}
    map.flyTo(o.m.getLatLng(),16,{duration:0.9});
    setTimeout(()=>o.m.openPopup(),950);});
});
clearBtn.onclick=()=>{q.value='';sg.style.display='none';clearBtn.style.display='none';};
document.addEventListener('click',e=>{
  if(!document.getElementById('topbar').contains(e.target))sg.style.display='none';});

/* ───────── 목록 시트 ───────── */
const sheet=document.getElementById('sheet'),listBtn=document.getElementById('listBtn'),
      sheetList=document.getElementById('sheetList');
function buildSheet(){
  const vis=markers.filter(o=>!activeCat||o.cat===activeCat);
  listBtn.textContent=`☰ ${activeCat||'전체'} 목록 (${vis.length})`;
  let h='',last='';
  ['암스테르담','델프트','로테르담','앤트워프','브뤼셀'].forEach(c=>{
    const rows=vis.filter(o=>o.city===c);
    if(!rows.length)return;
    h+=`<div class="cityhead">📍 ${c} (${rows.length})</div>`;
    rows.forEach(o=>{h+=`<div class="li" data-i="${o.idx}">
      <div class="dot" style="background:${CAT[o.cat].c}">${CAT[o.cat].i}</div>
      <div><div class="nm">${o.name}</div><div class="ds">${o.memo}</div></div></div>`;});
  });
  sheetList.innerHTML=h;
  sheetList.querySelectorAll('.li').forEach(el=>el.onclick=()=>{
    const o=markers[+el.dataset.i];
    sheet.classList.remove('open');
    map.flyTo(o.m.getLatLng(),16,{duration:0.9});
    setTimeout(()=>o.m.openPopup(),950);});}
buildSheet();
listBtn.onclick=()=>sheet.classList.toggle('open');
document.querySelector('#sheet .grab').onclick=()=>sheet.classList.remove('open');
map.on('click',()=>sheet.classList.remove('open'));
/* PWA 서비스워커 등록 (앱 설치 가능하게) */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
